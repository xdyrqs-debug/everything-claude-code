<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'"
    />
    <title>Glassboard</title>
    <link rel="stylesheet" href="css/glass.css" />
  </head>
  <body>
    <div class="window">
      <div class="aurora"><span></span><span></span><span></span></div>

      <div id="lock" class="lock hidden"></div>

      <div id="app" class="app hidden">
        <aside class="sidebar glass drag">
          <div class="profile no-drag" id="profile"></div>
          <nav class="nav no-drag" id="nav"></nav>
          <div class="sidebar-scroll no-drag" id="side-extra"></div>
          <div class="sidebar-foot no-drag">
            <button class="nav-item" id="lock-btn"><span class="ico">🔒</span>Заблокировать</button>
          </div>
        </aside>

        <main class="main">
          <header class="topbar drag">
            <div class="title">
              <h1 id="view-title"></h1>
              <span class="sub" id="view-sub"></span>
            </div>
            <div class="spacer"></div>
            <div class="row" id="top-actions"></div>
            <button class="btn icon ghost" id="theme-btn" title="Светлая / тёмная тема"></button>
            <div class="win-controls">
              <button class="m" id="win-min" title="Свернуть"></button>
              <button class="x" id="win-max" title="Развернуть"></button>
              <button class="c" id="win-close" title="Закрыть"></button>
            </div>
          </header>
          <section class="content" id="content"></section>
        </main>
      </div>
    </div>

    <script src="js/util.js"></script>
    <script src="js/core.js"></script>
    <script src="js/views/lock.js"></script>
    <script src="js/views/tasks.js"></script>
    <script src="js/views/board.js"></script>
    <script src="js/views/mindmap.js"></script>
    <script src="js/views/notes.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
