name: Glassboard build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/glassboard/**'
      - '.github/workflows/glassboard-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/glassboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx --yes electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Glassboard-${{ runner.os }}
          path: |
            apps/glassboard/dist/*.dmg
            apps/glassboard/dist/*.exe
            apps/glassboard/dist/*.zip
            apps/glassboard/dist/*.AppImage
          if-no-files-found: error
